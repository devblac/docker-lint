name: Release

# Cut a release by pushing a vX.Y.Z tag whose CHANGELOG.md section exists.
# The result is a draft GitHub release; publish it by hand after review.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

      # The docker-lint-docker pre-commit hook names the image by version, so a
      # release must ship a hook that points at its own image.
      - name: Check the pre-commit hook uses this version's image
        run: |
          image="ghcr.io/devblac/docker-lint:${GITHUB_REF_NAME#v}"
          if ! grep -q "entry: $image\$" .pre-commit-hooks.yaml; then
            echo "::error file=.pre-commit-hooks.yaml::the docker-lint-docker hook must use $image"
            exit 1
          fi

      - name: Extract release notes from CHANGELOG.md
        run: sh scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/release-notes.md"

      - name: Build and upload release
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --release-notes ${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
