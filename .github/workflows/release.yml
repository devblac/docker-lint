name: Release

# Cut a release by pushing a vX.Y.Z tag whose CHANGELOG.md section exists.
# The result is a draft GitHub release; publish it by hand after review.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Extract release notes from CHANGELOG.md
        run: sh scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/release-notes.md"

      - name: Build and upload release
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --release-notes ${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Snapshot builds in CI skip the release notes, so check the real release.
      - name: Check the release has notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          body="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json body --jq .body)"
          if [ -z "$(printf '%s' "$body" | tr -d '[:space:]')" ]; then
            echo "::error::release $GITHUB_REF_NAME has empty notes"
            exit 1
          fi
