name: Action

# Exercises the GitHub Action in this repository on every runner OS. It builds
# docker-lint from source ("version: source") because a pull request must be
# testable before any release exists.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Lint a clean Dockerfile
        id: clean
        uses: ./
        with:
          version: source
          dockerfile: testdata/valid/minimal.Dockerfile
          sarif-file: clean.sarif

      - name: Check the clean run
        shell: bash
        env:
          EXIT_CODE: ${{ steps.clean.outputs.exit-code }}
          SARIF_FILE: ${{ steps.clean.outputs.sarif-file }}
        run: |
          set -euo pipefail
          test "$EXIT_CODE" = 0
          test "$SARIF_FILE" = clean.sarif
          grep -q '"version": "2.1.0"' clean.sarif

      - name: Lint a Dockerfile Docker cannot build
        id: broken
        continue-on-error: true
        uses: ./
        with:
          version: source
          dockerfile: testdata/invalid/no-from.Dockerfile
          sarif-file: broken.sarif

      - name: Check the failing run
        shell: bash
        env:
          OUTCOME: ${{ steps.broken.outcome }}
          EXIT_CODE: ${{ steps.broken.outputs.exit-code }}
        run: |
          set -euo pipefail
          test "$OUTCOME" = failure
          test "$EXIT_CODE" = 1
          # The report is written even though the lint failed.
          grep -q '"ruleId": "DKL001"' broken.sarif

      - name: Lint a Dockerfile that does not parse
        id: fatal
        continue-on-error: true
        uses: ./
        with:
          version: source
          dockerfile: testdata/invalid/unknown-instruction.Dockerfile
          sarif-file: fatal.sarif

      - name: Check the fatal run
        shell: bash
        env:
          OUTCOME: ${{ steps.fatal.outcome }}
          EXIT_CODE: ${{ steps.fatal.outputs.exit-code }}
          SARIF_FILE: ${{ steps.fatal.outputs.sarif-file }}
        run: |
          set -euo pipefail
          test "$OUTCOME" = failure
          test "$EXIT_CODE" = 2
          # No empty report is left behind for an upload step to choke on.
          test -z "$SARIF_FILE"
          test ! -e fatal.sarif

      - name: Lint several Dockerfiles with a configuration
        id: multi
        uses: ./
        with:
          version: source
          dockerfile: |
            testdata/**/minimal.Dockerfile
            testdata/invalid/no-from.Dockerfile
          config: testdata/config/no-from-off.yaml
          sarif-file: multi.sarif

      - name: Check the multi-file run
        shell: bash
        env:
          EXIT_CODE: ${{ steps.multi.outputs.exit-code }}
        run: |
          set -euo pipefail
          test "$EXIT_CODE" = 0
          # Both files are in one report, and the disabled rule is gone.
          grep -q '"uri": "testdata/valid/minimal.Dockerfile"' multi.sarif
          grep -q '"uri": "testdata/invalid/no-from.Dockerfile"' multi.sarif
          ! grep -q '"ruleId": "DKL001"' multi.sarif
